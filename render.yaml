# Render Blueprint: the whole app on Render. See deploy/RENDER.md.
services:
  # Backend: Core API + AI Lite behind one gateway, demo data rebuilt on every start.
  - type: web
    name: jansevak-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/core_api/requirements.txt
    startCommand: bash deploy/render_start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  # Frontend: the built React app, served as a static site.
  - type: web
    name: jansevak-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        sync: false
      - key: VITE_AI_API_URL
        sync: false
